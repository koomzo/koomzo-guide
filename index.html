  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Koomzo User Guide — Restaurant &amp; Bar<\u002Ftitle>\n<link rel=\"icon\" type=\"image/png\" href=\"85c40aa7-77db-4751-b2e8-3dca63e4eb59\">\n<style>/* ============================================================\n   KOOMZO POS — Design Tokens\n   Colors + Type for the Koomzo Point of Sale design system.\n   Derived from the koomzo-designsystem Ionic 7 / Angular 17 repo\n   (calendar components reveal the real palette). System font\n   stack + Ionicons, matching Ionic's iOS mode.\n   ============================================================ */\n\n:root {\n  /* ---------- BRAND / PRIMARY ---------- */\n  --kz-primary:        #6a61bf;   /* Koomzo purple — brand, primary actions */\n  --kz-primary-shade:  #574fa6;   /* pressed / darker */\n  --kz-primary-tint:   #837bd0;   /* hover / lighter */\n  --kz-primary-wash:   #eeecf8;   /* selected row bg, soft fills */\n\n  --kz-indigo:         #4b4ad9;   /* alt accent (Official calendar) */\n  --kz-indigo-wash:    #ececfb;\n\n  /* ---------- SEMANTIC ACCENTS ---------- */\n  --kz-success:        #2e9e5b;   /* payment confirm, in-stock */\n  --kz-success-wash:   #e4f4ea;\n  --kz-discount:       #ec603a;   /* coral — discounts, markdowns, void */\n  --kz-discount-wash:  #fdeae4;\n  --kz-warning:        #e0a32e;   /* low stock, holds (from #f8cc76) */\n  --kz-warning-wash:   #fbf2dd;\n  --kz-info:           #528cef;   /* informational chips */\n  --kz-info-wash:      #e8f0fd;\n\n  /* ---------- INK / TEXT ---------- */\n  --kz-ink:            #141826;   /* primary text, totals */\n  --kz-ink-2:          #303b57;   /* headings, strong labels */\n  --kz-muted:          #676f88;   /* secondary text */\n  --kz-muted-2:        #858a9b;   /* tertiary, captions */\n  --kz-muted-3:        #a0a5ae;   /* placeholder, disabled */\n\n  /* ---------- SURFACES ---------- */\n  --kz-bg:             #f4f6f9;   /* app background (blue-gray) */\n  --kz-surface:        #ffffff;   /* cards, panels */\n  --kz-surface-2:      #f9fafb;   /* nested rows, inset wells */\n  --kz-border:         #e9ecee;   /* hairlines, card borders */\n  --kz-border-strong:  #d8dce2;\n\n  /* ---------- DARK SURFACES (Dark theme / kiosk) ---------- */\n  --kz-dark-bg:        #272b34;\n  --kz-dark-surface:   #373d41;\n  --kz-dark-ink:       #ececec;\n  --kz-dark-muted:     #babcc2;\n\n  /* ---------- RADII ---------- */\n  --kz-radius-sm:      6px;    /* chips, badges */\n  --kz-radius:         10px;   /* cards (Modern calendar) */\n  --kz-radius-lg:      16px;   /* panels, sheets */\n  --kz-radius-pill:    999px;  /* segment, avatars, pill buttons */\n\n  /* ---------- ELEVATION ---------- */\n  --kz-shadow-sm:  0 1px 2px rgba(20, 24, 38, 0.06);\n  --kz-shadow:     0 4px 16px rgba(20, 24, 38, 0.08);\n  --kz-shadow-lg:  0 12px 32px rgba(20, 24, 38, 0.12);\n  --kz-shadow-key: 0 6px 14px rgba(106, 97, 191, 0.28); /* primary button glow */\n\n  /* ---------- SPACING (8pt base, 4pt half-steps) ---------- */\n  --kz-space-1: 4px;\n  --kz-space-2: 8px;\n  --kz-space-3: 12px;\n  --kz-space-4: 16px;\n  --kz-space-5: 20px;\n  --kz-space-6: 24px;\n  --kz-space-8: 32px;\n  --kz-space-10: 40px;\n  --kz-touch:    44px;   /* minimum hit target (Ionic) */\n\n  /* ---------- TYPE FAMILIES ---------- */\n  /* Ionic default = system stack. No custom webfonts in the repo. */\n  --kz-font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto,\n                  \"Helvetica Neue\", Arial, sans-serif;\n  --kz-font-num:  \"SF Pro Display\", -apple-system, BlinkMacSystemFont, Roboto,\n                  \"Helvetica Neue\", sans-serif; /* prices: tabular figures */\n\n  /* ---------- TYPE SCALE (rem-ish, px for clarity) ---------- */\n  --kz-display:   34px;  /* order total hero */\n  --kz-h1:        28px;\n  --kz-h2:        22px;\n  --kz-h3:        18px;\n  --kz-body:      16px;\n  --kz-body-sm:   14px;\n  --kz-caption:   13px;\n  --kz-micro:     11px;\n\n  --kz-weight-regular: 400;\n  --kz-weight-medium:  500;\n  --kz-weight-semi:    600;\n  --kz-weight-bold:    700;\n}\n\n/* ============================================================\n   SEMANTIC TYPE CLASSES\n   ============================================================ */\n.kz-display {\n  font-family: var(--kz-font-num);\n  font-size: var(--kz-display);\n  font-weight: var(--kz-weight-bold);\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n  color: var(--kz-ink);\n  font-variant-numeric: tabular-nums;\n}\n.kz-h1 { font: var(--kz-weight-bold) var(--kz-h1)/1.2 var(--kz-font-sans); letter-spacing: -0.01em; color: var(--kz-ink); }\n.kz-h2 { font: var(--kz-weight-semi) var(--kz-h2)/1.25 var(--kz-font-sans); letter-spacing: -0.01em; color: var(--kz-ink-2); }\n.kz-h3 { font: var(--kz-weight-semi) var(--kz-h3)/1.3 var(--kz-font-sans); color: var(--kz-ink-2); }\n.kz-body { font: var(--kz-weight-regular) var(--kz-body)/1.5 var(--kz-font-sans); color: var(--kz-ink); }\n.kz-body-strong { font: var(--kz-weight-semi) var(--kz-body)/1.45 var(--kz-font-sans); color: var(--kz-ink); }\n.kz-caption { font: var(--kz-weight-medium) var(--kz-caption)/1.4 var(--kz-font-sans); color: var(--kz-muted); }\n.kz-label {\n  font: var(--kz-weight-semi) var(--kz-micro)/1.2 var(--kz-font-sans);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--kz-muted-2);\n}\n.kz-price {\n  font-family: var(--kz-font-num);\n  font-weight: var(--kz-weight-semi);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.01em;\n  color: var(--kz-ink);\n}\n<\u002Fstyle>\n<style>*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--kz-bg);font-family:var(--kz-font-sans);color:var(--kz-ink);-webkit-font-smoothing:antialiased}\na{color:var(--kz-primary);text-decoration:none}a:hover{color:var(--kz-primary-shade)}\n.ug-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;heig g-left:18px}\n.ladder li{font-size:13px;margin-bottom:3px}\n/* devices diagram */\n.net{position:relative;background:#fff;border:1px solid var(--kz-border);border-radius:var(--kz-radius-lg);box-shadow:var(--kz-shadow);overflow:hidden;max-width:960px;margin:6px 0 10px}\n.net__stage{position:relative;aspect-ratio:16/8.4;background-color:var(--kz-surface-2);background-image:radial-gradient(var(--kz-border) 1px,transparent 1px);background-size:22px 22px}\n.net svg{position:absolute;inset:0;width:100%;height:100%}\n.net line{stroke:var(--kz-border-strong);stroke-width:2.5;vector-effect:non-scaling-stroke;transition:stroke .2s}\n.net line.on{stroke:var(--kz-primary);stroke-width:3.5}\n.net line.cut{stroke:var(--kz-discount);stroke-dasharray:6 6}\n.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center}\n.node__box{width:66px;height:66px;border-radius:18px;background:#fff;border:1.5px solid var(--kz-border-strong);display:grid;place-items:center;box-shadow:var(--kz-shadow-sm);transition:transform .2s,border-color .2s,box-shadow .2s;position:relative}\n.node__box ion-icon{font-size:30px;color:var(--kz-ink-2)}\n.node b{font:700 12.5px var(--kz-font-sans)}\n.node small{font:500 11px var(--kz-font-sans);color:var(--kz-muted-2);margin-top:-4px}\n.node.main .node__box{width:84px;height:84px;background:var(--kz-primary);border-color:var(--kz-primary);box-shadow:var(--kz-shadow-key)}\n.node.main .node__box ion-icon{color:#fff;font-size:36px}\n.node.cloud .node__box{border-style:dashed}\n.node.hot .node__box{transform:scale(1.08);border-color:var(--kz-primary);box-shadow:0 0 0 5px var(--kz-primary-wash)}\n.node.main.hot .node__box{box-shadow:0 0 0 6px var(--kz-primary-tint)}\n.node__badge{position:absolute;top:-8px;right:-10px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--kz-warning);color:#3a2a05;font:700 11.5px var(--kz-font-num);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}\n.node__badge.show{display:flex}\n.dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--kz-primary);box-shadow:0 0 0 5px var(--kz-primary-tint);transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),opacity .2s;opacity:0;z-index:3}\n.dot.show{opacity:1}\n.dot.money{background:var(--kz-success);box-shadow:0 0 0 5px var(--kz-success-wash)}\n.net__bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--kz-border);flex-wrap:wrap}\n.net__cap{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;font:600 14px var(--kz-font-sans);color:var(--kz-ink)}\n.net__n{width:26px;height:26px;border-radius:7px;background:var(--kz-primary);color:#fff;display:grid;place-items:center;font:700 12px var(--kz-font-num);flex:none}\n.net__btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--kz-border-strong);background:#fff;font:600 12.5px var(--kz-font-sans);color:var(--kz-ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}\n.net__btn ion-icon{font-size:16px}\n.net__btn.on{background:var(--kz-discount);border-color:var(--kz-discount);color:#fff}\n.net__net{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--kz-font-sans);padding:0 11px;height:28px;border-radius:999px;background:var(--kz-success-wash);color:#1f7a45}\n.net__net.off{background:var(--kz-discount-wash);color:#b8401f}\n.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 14px;max-width:960px}\n.roles .card{padding:13px 15px}\n.roles h4{font-size:13.5px}\n.roles h4 ion-icon{font-size:17px;color:var(--kz-primary)}\n.roles p{font-size:12.5px;line-height:1.55;margin:0;color:var(--kz-muted)}\n.foot{margin-top:70px;padding-top:20px;border-top:1px solid var(--kz-border);font:400 12.5px var(--kz-font-sans);color:var(--kz-muted-2)}\n@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}.doc{padding:26px 18px 80px}.ladder{grid-template-columns:1fr}.chips div{grid-template-columns:1fr;gap:4px}.node{width:110px}.node__box{width:48px;height:48px;border-radius:13px}.node__box ion-icon{font-size:22px}.node.main .node__box{width:60px;height:60px}.node.main .node__box ion-icon{font-size:26px}.node small{display:none}.ug-mark span{display:none}}\n@media (max-width:560px){h1{font-size:27px}.net__stage{aspect-ratio:4/3.4}.node b{font-size:11px}}\n@media (prefers-reduced-motion:reduce){.dot{transition:none}.node__box{transition:none}}\n@media print{.ug-top,.side,.net__bar button{display:none}.shell{grid-template-columns:1fr}.doc{padding:0;max-width:none}.part{break-before:page}.shot,.card,table,.net{break-inside:avoid;box-shadow:none}}\n<\u002Fstyle>\n<script>(function(){var b='https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons';var s=document.createElement('script');s.type='module';s.src=b+'.esm.js';document.head.appendChild(s);})();<\u002Fscript>\n<\u002Fhead>\n<body>\n<header class=\"ug-top\">\n<div class=\"ug-mark\"><div class=\"ic\"><ion-icon name=\"book-outline\"><\u002Fion-icon><\u002Fdiv><b>Koomzo User Guide<\u002Fb><span>Version 1 · October 2026<\u002Fspan><\u002Fdiv>\n<nav class=\"ug-mods\" aria-label=\"Module guides\">\n<a href=\"#rk\"><ion-icon name=\"restaurant-outline\"><\u002Fion-icon>Restaurant &amp; Bar<\u002Fa>\n<span><ion-icon name=\"storefront-outline\"><\u002Fion-icon>Retail <em>Soon<\u002Fem><\u002Fspan>\n<span><ion-icon name=\"basket-outline\"><\u002Fion-icon>Grocery <em>Soon<\u002Fem><\u002Fspan>\n<span><ion-icon name=\"cut-outline\"><\u002Fion-icon>Salon <em>Soon<\u002Fem><\u002Fspan>\n<span><ion-icon name=\"barbell-outline\"><\u002Fion-icon>Gym <em>Soon<\u002Fem><\u002Fspan>\n<span><ion-icon name=\"bed-outline\"><\u002Fion-icon>Hotel <em>Soon<\u002Fem><\u002Fspan>\n<\u002Fnav>\n<div class=\"ug-lang\" aria-label=\"Language\"><b>EN<\u002Fb><a data-lang-link=\"fr\" href=\"Koomzo Guide utilisateur.html\" hreflang=\"fr\">FR<\u002Fa><\u002Fdiv>\n<\u002Fheader>\n<div class=\"shell\">\n<nav class=\"side\" aria-label=\"Contents\">\n<div class=\"side__g\">Start here<\u002Fdiv>\n<a href=\"#welcome\"><ion-icon name=\"sparkles-outline\"><\u002Fion-icon>Welcome<\u002Fa>\n<a href=\"#tiers\"><ion-icon name=\"layers-outline\"><\u002Fion-icon>Lite, Mid and Full<\u002Fa>\n<div class=\"side__g\">Platform — every module<\u002Fdiv>\n<a href=\"#p1\"><ion-icon name=\"rocket-outline\"><\u002Fion-icon>P1 · Getting started<\u002Fa>\n<a href=\"#p2\"><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon>P2 · Devices &amp; roles<\u002Fa>\n<a class=\"sub\" href=\"#p2-hw\">Everyday or professional<\u002Fa>\n<a href=\"#p3\"><ion-icon name=\"cloud-offline-outline\"><\u002Fion-icon>P3 · Working offline<\u002Fa>\n<a href=\"#p4\"><ion-icon name=\"git-network-outline\"><\u002Fion-icon>P4 · Several devices<\u002Fa>\n<a href=\"#p5\"><ion-icon name=\"card-outline\"><\u002Fion-icon>P5 · Payments<\u002Fa>\n<a href=\"#p6\"><ion-icon name=\"tv-outline\"><\u002Fion-icon>P6 · Menu boards<\u002Fa>\n<div class=\"side__g\">Restaurant &amp; Bar<\u002Fdiv>\n<a href=\"#rk\"><ion-icon name=\"restaurant-outline\"><\u002Fion-icon>1 · Is this for me?<\u002Fa>\n<a href=\"#rk-setup\"><ion-icon name=\"construct-outline\"><\u002Fion-icon>2 · Set up<\u002Fa>\n<a href=\"#rk-day\"><ion-icon name=\"sunny-outline\"><\u002Fion-icon>3 · Run the day<\u002Fa>\n<a href=\"#rk-screens\"><ion-icon name=\"albums-outline\"><\u002Fion-icon>4 · Screens<\u002Fa>\n<a class=\"sub\" href=\"#s-register\">Register<\u002Fa>\n<a class=\"sub\" href=\"#s-floor\">Floor<\u002Fa>\n<a class=\"sub\" href=\"#s-kitchen\">Kitchen screen<\u002Fa>\n<a class=\"sub\" href=\"#s-kiosk\">Kiosk<\u002Fa>\n<a class=\"sub\" href=\"#s-setup\">Setup<\u002Fa>\n<a href=\"#rk-help\"><ion-icon name=\"help-buoy-outline\"><\u002Fion-icon>5 · When something goes wrong<\u002Fa>\n<a href=\"#rk-more\"><ion-icon name=\"trending-up-outline\"><\u002Fion-icon>6 · Go further<\u002Fa>\n<a href=\"#rk-cards\"><ion-icon name=\"id-card-outline\"><\u002Fion-icon>Staff task cards<\u002Fa>\n<\u002Fnav>\n<main class=\"doc\">\n\n<section id=\"welcome\">\n<p class=\"eb\">Koomzo User Guide<\u002Fp>\n<h1>Run your restaurant on the phones and tablets you already have.<\u002Fh1>\n<p class=\"lede\">Koomzo is one app for taking orders, running the kitchen, getting paid and keeping your figures — built for maquis, restaurants, bars and snacks in Cameroon and West Africa. It keeps working through power cuts and when the internet is down, and it grows with you: start with one phone, add the kitchen screen, the kiosk and the menu board when you're ready.<\u002Fp>\n<div class=\"grid3\">\n<div class=\"card ic-card\"><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon><h4>Start on what you have<\u002Fh4><p>Every screen works on a phone, a tablet or a laptop — or on professional POS terminals with a built-in printer when you want them. See <a href=\"#p2-hw\">P2<\u002Fa>.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"cloud-offline-outline\"><\u002Fion-icon><h4>Works without internet<\u002Fh4><p>Orders, the kitchen and cash keep going. Everything is sent when the connection returns.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"cash-outline\"><\u002Fion-icon><h4>Cash, MoMo, Orange Money<\u002Fh4><p>Split any bill between them. Amounts in FCFA, to the franc.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"sub\"><b>How to read this guide.<\u002Fb> The <b>Platform<\u002Fb> chapters explain what every Koomzo business shares: devices, offline, payments, screens. Each <b>module guide<\u002Fb> then follows the same six parts, so you always know where to look. This edition covers <b>Restaurant &amp; Bar<\u002Fb>; guides for the other modules will follow in the same format.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"tiers\" class=\"part\">\n<p class=\"eb\">Start small, grow later<\u002Fp>\n<h2>Lite, Mid and Full<\u002Fh2>\n<p class=\"sub\">Koomzo shows you only what you need. Every feature in this guide carries a tag telling you when it appears. You can switch on more at any time, and nothing you've set up is lost.<\u002Fp>\n<div class=\"ladder\">\n<div><h4><span class=\"tier lite\">Lite<\u002Fspan>Open and take money<\u002Fh4><ul><li>Register: order, send, pay<\u002Fli><li>Floor: tables and who's seated<\u002Fli><li>Cash, MoMo, Orange Money, split bill<\u002Fli><li>Works offline on one device<\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4><span class=\"tier mid\">Mid<\u002Fspan>The daily loop<\u002Fh4><ul><li>Kitchen screen<\u002Fli><li>Courses: starters first, mains later<\u002Fli><li>Several devices on one Wi-Fi<\u002Fli><li>Menu board on a TV<\u002Fli><li>Move, join and split tables<\u002Fli><\u002Ful><\u002Fdiv>\n<div><h4><span class=\"tier full\">Full<\u002Fspan>More control, more sites<\u002Fh4><ul><li>Self-order kiosk<\u002Fli><li>Kitchen stations and all-day counts<\u002Fli><li>Bar tabs<\u002Fli><li>Void rules and owner approval<\u002Fli><li>Stock and recipes, several locations<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note\"><ion-icon name=\"information-circle-outline\"><\u002Fion-icon><p>Some features are marked <span class=\"soon\"><ion-icon name=\"time-outline\"><\u002Fion-icon>Available soon<\u002Fspan>. They are designed and shown in this guide so you can plan, but are not yet in the version you install today.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p1\" class=\"part\">\n<p class=\"eb\">Platform · P1<\u002Fp>\n<h2>Getting started <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh2>\n<ol class=\"steps\">\n<li><div><b>Create your account<\u002Fb><span>With your phone number. You become the <b>owner<\u002Fb>.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Add your business and location<\u002Fb><span>Name, town, currency (FCFA) and VAT rate (19.25 % in Cameroon). One location to start; add more later on Full.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Add your staff<\u002Fb><span>Each person gets a role — owner, manager, cashier, server or cook — and a 4-digit PIN. The role decides what they can see and do.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Choose your business type<\u002Fb><span>Pick Restaurant &amp; Bar. Koomzo opens the register and the floor; everything else stays hidden until you switch it on.<\u002Fspan><\u002Fdiv><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section id=\"p2\" class=\"part\">\n<p class=\"eb\">Platform · P2<\u002Fp>\n<h2>Devices &amp; roles<\u002Fh2>\n<p class=\"sub\">One device can do everything. As you grow, each device takes one job. Watch a few minutes of service at Chez Mama Ngono — then cut the internet and see that nothing stops.<\u002Fp>\n<div class=\"net\" id=\"net\">\n<div class=\"net__stage\">\n<svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n<line data-l=\"main-phone\" x1=\"50\" y1=\"54\" x2=\"15\" y2=\"30\"><\u002Fline>\n<line data-l=\"kiosk-main\" x1=\"50\" y1=\"54\" x2=\"15\" y2=\"80\"><\u002Fline>\n<line data-l=\"kitchen-main\" x1=\"50\" y1=\"54\" x2=\"85\" y2=\"30\"><\u002Fline>\n<line data-l=\"main-tv\" x1=\"50\" y1=\"54\" x2=\"85\" y2=\"80\"><\u002Fline>\n<line data-l=\"cloud-main\" x1=\"50\" y1=\"54\" x2=\"50\" y2=\"13\"><\u002Fline>\n<\u002Fsvg>\n<div class=\"node cloud\" data-id=\"cloud\" style=\"left:50%;top:13%\"><div class=\"node__box\"><ion-icon name=\"cloud-outline\"><\u002Fion-icon><\u002Fdiv><b>Koomzo cloud<\u002Fb><small>Backup &amp; reports<\u002Fsmall><\u002Fdiv>\n<div class=\"node main\" data-id=\"main\" style=\"left:50%;top:54%\"><div class=\"node__box\"><ion-icon name=\"laptop-outline\"><\u002Fion-icon><span class=\"node__badge\"><\u002Fspan><\u002Fdiv><b>Main device · Till<\u002Fb><small>Stays plugged in<\u002Fsmall><\u002Fdiv>\n<div class=\"node\" data-id=\"phone\" style=\"left:15%;top:30%\"><div class=\"node__box\"><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon><\u002Fdiv><b>Server's phone<\u002Fb><small>Orders at the table<\u002Fsmall><\u002Fdiv>\n<div class=\"node\" data-id=\"kiosk\" style=\"left:15%;top:80%\"><div class=\"node__box\"><ion-icon name=\"tablet-portrait-outline\"><\u002Fion-icon><\u002Fdiv><b>Kiosk<\u002Fb><small>Customers order<\u002Fsmall><\u002Fdiv>\n<div class=\"node\" data-id=\"kitchen\" style=\"left:85%;top:30%\"><div class=\"node__box\"><ion-icon name=\"restaurant-outline\"><\u002Fion-icon><\u002Fdiv><b>Kitchen screen<\u002Fb><small>Cook sees orders<\u002Fsmall><\u002Fdiv>\n<div class=\"node\" data-id=\"tv\" style=\"left:85%;top:80%\"><div class=\"node__box\"><ion-icon name=\"tv-outline\"><\u002Fion-icon><\u002Fdiv><b>Menu board<\u002Fb><small>TV on the wall<\u002Fsmall><\u002Fdiv>\n<span class=\"dot\"><\u002Fspan>\n<\u002Fdiv>\n<div class=\"net__bar\">\n<div class=\"net__cap\"><span class=\"net__n\">1<\u002Fspan><span>…<\u002Fspan><\u002Fdiv>\n<span class=\"net__net\"><ion-icon name=\"cloud-done-outline\"><\u002Fion-icon>Internet on<\u002Fspan>\n<button class=\"net__btn\" type=\"button\"><ion-icon name=\"cloud-offline-outline\"><\u002Fion-icon>Cut the internet<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"roles\">\n<div class=\"card\"><h4><ion-icon name=\"laptop-outline\"><\u002Fion-icon>Main device<\u002Fh4><p>The till that stays on and plugged in — a laptop or tablet on a power bank. Keeps the data, talks to the internet.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon>Server's phone<\u002Fh4><p>Take the order at the table and send it. Any cheap Android phone works.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"restaurant-outline\"><\u002Fion-icon>Kitchen screen<\u002Fh4><p>A tablet in the kitchen. Orders arrive by station; the cook taps Ready. <span class=\"tier mid\">Mid<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"tablet-portrait-outline\"><\u002Fion-icon>Kiosk<\u002Fh4><p>A tablet on the counter. Customers order and pay themselves. <span class=\"tier full\">Full<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"tv-outline\"><\u002Fion-icon>Menu board<\u002Fh4><p>A TV with a stick. Shows the menu and prices from the till. <span class=\"tier mid\">Mid<\u002Fspan><\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<h3 id=\"p2-hw\">Two ways to equip your restaurant<\u002Fh3>\n<p class=\"sub\">Koomzo is not tied to one brand of device. Start with everyday phones and tablets, or choose professional point-of-sale hardware — or mix both. The same app runs on all of them.<\u002Fp>\n<div class=\"grid2\">\n<div class=\"card\"><h4><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon>Everyday devices <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh4><ul><li>Android phones and tablets, a laptop for the till<\u002Fli><li>Bluetooth receipt printer, from about 25 000 F<\u002Fli><li>Lowest cost — often devices you already own<\u002Fli><li>Best for a maquis or snack getting started<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"hardware-chip-outline\"><\u002Fion-icon>Professional POS terminals <span class=\"soon\"><ion-icon name=\"time-outline\"><\u002Fion-icon>Available soon<\u002Fspan><\u002Fh4><ul><li>All-in-one counter tills with a built-in printer and a customer screen<\u002Fli><li>Rugged handhelds for servers, with printer, card reader and NFC<\u002Fli><li>Built for long shifts, heat and dust; easier to manage in numbers<\u002Fli><li>Supplied with Koomzo installed, under your reseller's brand if you wish<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tbl\"><table>\n<thead><tr><th>Use<\u002Fth><th>Example terminals (Android)<\u002Fth><th>Indicative price<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><b>Server handheld<\u002Fb> — order and print at the table<\u002Ftd><td>Sunmi M3 · PAX A920MAX<\u002Ftd><td>about 200 000–300 000 F<\u002Ftd><\u002Ftr>\n<tr><td><b>Counter till<\u002Fb> — 15.6\" screen, printer, customer display<\u002Ftd><td>Sunmi D3 Pro · Sunmi D3 Mini · PAX E800<\u002Ftd><td>about 260 000–420 000 F<\u002Ftd><\u002Ftr>\n<tr><td><b>Larger roll-outs<\u002Fb> — own branding, remote app updates<\u002Ftd><td>Direct from manufacturers such as HCCTG or Datamega<\u002Ftd><td>On quotation<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"note\"><ion-icon name=\"information-circle-outline\"><\u002Fion-icon><p>Prices are indicative, converted from international list prices, before shipping and duties. Ask your Koomzo reseller for a tested model and local price.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p3\" class=\"part\">\n<p class=\"eb\">Platform · P3<\u002Fp>\n<h2>Working offline <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh2>\n<p class=\"sub\">Koomzo saves every action on the device first, then sends it when it can. You never wait for the internet to take an order or close a table.<\u002Fp>\n<div class=\"grid2\">\n<div class=\"card\"><h4><ion-icon name=\"checkmark-circle-outline\" style=\"color:var(--kz-success)\"><\u002Fion-icon>Keeps working without internet<\u002Fh4><ul><li>Taking orders, sending to the kitchen<\u002Fli><li>Kitchen screen, floor, moving tables<\u002Fli><li>Cash payments and split bills<\u002Fli><li>Voids and notes<\u002Fli><li>Kiosk orders paid at the counter<\u002Fli><\u002Ful><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"cloud-outline\" style=\"color:var(--kz-info)\"><\u002Fion-icon>Needs the internet<\u002Fh4><ul><li>Confirming a MoMo or Orange Money payment<\u002Fli><li>Changing menu prices, taxes or staff<\u002Fli><li>Reports for the owner away from the restaurant<\u002Fli><li>Setting up a brand-new device for the first time<\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<h3>The sync light<\u002Fh3>\n<p class=\"sub\">Top right of every screen. Glance at it; you rarely need to do anything.<\u002Fp>\n<div class=\"chips\">\n<div><span class=\"chip ok\"><ion-icon name=\"cloud-done-outline\"><\u002Fion-icon>Synced<\u002Fspan><span>Everything is saved and backed up.<\u002Fspan><\u002Fdiv>\n<div><span class=\"chip sync\"><ion-icon name=\"sync-outline\"><\u002Fion-icon>Syncing · 3 of 12<\u002Fspan><span>The connection is back and changes are being sent.<\u002Fspan><\u002Fdiv>\n<div><span class=\"chip wait\"><ion-icon name=\"cloud-upload-outline\"><\u002Fion-icon>No internet · 12 waiting<\u002Fspan><span>Safe on this device. Keep working; it sends by itself later.<\u002Fspan><\u002Fdiv>\n<div><span class=\"chip bad\"><ion-icon name=\"alert-circle-outline\"><\u002Fion-icon>1 needs attention<\u002Fspan><span>The cloud couldn't accept a change — for example, a price was changed by the owner meanwhile. A manager looks at it; cashiers are never asked.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note warn\"><ion-icon name=\"log-out-outline\"><\u002Fion-icon><p><b>Before you log out or switch business, wait for Synced.<\u002Fb> Logging out clears the device for the next person, and Koomzo will warn you if changes are still waiting.<\u002Fp><\u002Fdiv>\n<p class=\"sub\">A brand-new device shows <b>Preparing offline data…<\u002Fb> the first time it connects while it downloads your menu, tables and staff. That needs the internet once; after that, it works offline.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"p4\" class=\"part\">\n<p class=\"eb\">Platform · P4<\u002Fp>\n<h2>Several devices together <span class=\"tier mid\">Mid<\u002Fspan> <span class=\"soon\"><ion-icon name=\"time-outline\"><\u002Fion-icon>Available soon<\u002Fspan><\u002Fh2>\n<p class=\"sub\">Phones, the kitchen screen and the kiosk talk to the <b>main device<\u002Fb> over your Wi-Fi — even when the internet is down. Only the main device uses data.<\u002Fp>\n<div class=\"shot\"><img src=\"d30d0bc1-8976-4ce2-a071-35d6decc31d3\" alt=\"Setting up the main device and joining it from a phone\"><\u002Fdiv>\n<ol class=\"steps\">\n<li><div><b>Choose the main device<\u002Fb><span>Settings → Local network → <i>Main device<\u002Fi>. Pick the till that stays on and plugged in — a laptop till is ideal.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Join the other devices<\u002Fb><span>On each phone or tablet: <i>Join<\u002Fi>. The main device is usually found by itself; otherwise scan its QR code or type its 6-digit code.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Approve and give each a job<\u002Fb><span>The main device asks you to approve each new device. Choose its job: till, server, kitchen screen, kiosk or display.<\u002Fspan><\u002Fdiv><\u002Fli>\n<\u002Fol>\n<div class=\"grid2\">\n<div class=\"card\"><h4><ion-icon name=\"wifi-outline\"><\u002Fion-icon>No Wi-Fi router?<\u002Fh4><p>Use the Wi-Fi you already have, turn on the main device's own hotspot, or buy a <b>battery-powered pocket hotspot<\u002Fb> (MiFi) — about 35 000–60 000 F. It stays on for 8–10 hours when the power goes off, and works as your local network even with no data credit.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"battery-dead-outline\"><\u002Fion-icon>Main device switched off?<\u002Fh4><p>The other devices keep taking orders and show <i>Main device lost · 3 waiting<\u002Fi>. Cash works; MoMo waits. A manager can make another device the main one.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"note ok\"><ion-icon name=\"battery-charging-outline\"><\u002Fion-icon><p><b>Choosing a pocket hotspot.<\u002Fb> Look for one that is <b>unlocked<\u002Fb> (takes any MTN, Orange or Moov SIM), has a <b>2 000 mAh battery or more<\u002Fb>, and allows <b>10 or more devices<\u002Fb>. Budget models such as KuWFi or E-Transit are sold on AliExpress; branded models such as the Mercusys MT110 (TP-Link) on Amazon. Ask your Koomzo reseller for a tested model.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p5\" class=\"part\">\n<p class=\"eb\">Platform · P5<\u002Fp>\n<h2>Payments <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh2>\n<div class=\"grid3\">\n<div class=\"card ic-card\"><ion-icon name=\"cash-outline\"><\u002Fion-icon><h4>Cash<\u002Fh4><p>Enter what was handed over; Koomzo shows the change. Amounts are whole francs.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"phone-portrait-outline\"><\u002Fion-icon><h4>MTN MoMo · Orange Money<\u002Fh4><p>Enter the customer's number. They confirm on their phone while a countdown runs. Needs the internet on the main device.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"git-branch-outline\"><\u002Fion-icon><h4>Split<\u002Fh4><p>Part MoMo, part cash. Or split by what each person ate, or evenly.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"sub\">Every receipt carries a ticket number such as <b>DLA-01-0412-0057<\u002Fb>: location, till, day's session, and number — so any receipt can be traced.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"p6\" class=\"part\">\n<p class=\"eb\">Platform · P6<\u002Fp>\n<h2>Menu boards on a TV <span class=\"tier mid\">Mid<\u002Fspan><\u002Fh2>\n<p class=\"sub\">Put your menu on any TV with an Android stick or a smart TV. The board reads the dishes and prices from your register, so you change a price once.<\u002Fp>\n<ul>\n<li><b>Pair the TV:<\u002Fb> it shows a 6-digit code; enter it in Signage → Screens.<\u002Fli>\n<li><b>Choose what plays:<\u002Fb> the menu, a dish of the day, a promotion. One list of slides can play on every screen.<\u002Fli>\n<li><b>By time of day:<\u002Fb> breakfast until 11:00, lunch after, the bar menu at night.<\u002Fli>\n<li><b>No internet?<\u002Fb> The TV keeps showing the last version it received.<\u002Fli>\n<\u002Ful>\n<p class=\"sub\">Full set-up: <a href=\"Koomzo Signage - Screens.html\">Signage module<\u002Fa>.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"rk\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 1<\u002Fp>\n<h2>Is this for me?<\u002Fh2>\n<p class=\"sub\">Restaurant &amp; Bar suits any place where people eat or drink — at a table, at the bar, or to take away. Setup offers a starting layout for each:<\u002Fp>\n<div class=\"grid3\">\n<div class=\"card\"><h4>Maquis / small restaurant<\u002Fh4><p>Salle and terrasse. The most common start.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4>Restaurant<\u002Fh4><p>Salle, terrasse and a bar counter.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4>Bar / lounge<\u002Fh4><p>Stools at the bar and lounge tables.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4>Hotel restaurant<\u002Fh4><p>Restaurant, bar and room service.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4>Snack / fast food<\u002Fh4><p>Order at the counter, a few tables to eat in.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4>Counter only<\u002Fh4><p>No tables — tabs and counter tickets.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<h3>A day at Chez Mama Ngono<\u002Fh3>\n<p class=\"sub\">A maquis in Bonamoussadi, Douala: 8 tables in the salle, 4 on the terrasse. Mama runs the till; Grace and Junior serve; Paul cooks; a kiosk by the door; a TV menu board.<\u002Fp>\n<div class=\"day\">\n<div class=\"day__row\"><span class=\"day__t\">10:30<\u002Fspan><div class=\"day__b\"><b>Opening<\u002Fb><span>Mama turns on the till — the main device. The phones, kitchen tablet and kiosk connect on their own. She opens the shift with 20 000 F float.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">12:15<\u002Fspan><div class=\"day__b\"><b>Lunch rush<\u002Fb><span>Four guests sit at Table 4. Grace seats them on her phone, takes 2 Ndolé, 1 Poulet DG and drinks, and taps Send. Paul's kitchen screen shows it before she reaches the kitchen.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">12:40<\u002Fspan><div class=\"day__b\"><b>A change of mind<\u002Fb><span>One guest wants Poisson Braisé instead of Ndolé. Grace voids the Ndolé with a reason; Paul sees it crossed out and taps Seen.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">13:05<\u002Fspan><div class=\"day__b\"><b>The terrasse fills up<\u002Fb><span>Friends join Table 4. Grace moves the party to the terrasse and joins two tables. The kitchen tickets follow them.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">13:30<\u002Fspan><div class=\"day__b\"><b>Power cut<\u002Fb><span>The ENEO power goes; the 4G box is on a battery, the till on its power bank. Orders keep flowing between devices. The sync light shows <i>No internet · 8 waiting<\u002Fi>.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">13:50<\u002Fspan><div class=\"day__b\"><b>The bill<\u002Fb><span>Table 4 asks for the addition. Two pay by MoMo once the internet is back, the rest in cash. Mama clears the table; the kitchen screen clears it too.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">19:00<\u002Fspan><div class=\"day__b\"><b>Evening<\u002Fb><span>The TV switches to the bar menu. A customer orders a takeaway on the kiosk and pays at the counter.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"day__row\"><span class=\"day__t\">23:30<\u002Fspan><div class=\"day__b\"><b>Closing<\u002Fb><span>Mama checks the sync light shows Synced, reviews today's voids, and closes the shift. The owner sees the day's sales on his phone.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rk-setup\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 2<\u002Fp>\n<h2>Set up <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh2>\n<p class=\"sub\">About an hour, once. Do it before your first service.<\u002Fp>\n<ol class=\"steps\">\n<li><div><b>Getting started<\u002Fb><span>Account, location and staff — see <a href=\"#p1\">P1<\u002Fa>.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Choose a layout<\u002Fb><span>Setup → Floor plan → <i>Start from a layout<\u002Fi>. Maquis (Salle + Terrasse) is the usual choice. Set the number of tables in each area.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Add your menu<\u002Fb><span>Categories (Starters, Mains, Grills, Drinks…), each dish with its price and the station that prepares it — grill, sauce pot, bar.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Choose payments<\u002Fb><span>Cash is on. Add MTN MoMo and Orange Money with your merchant numbers.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Choose your devices<\u002Fb><span>One device to start. Add phones, a kitchen screen and a kiosk later — <a href=\"#p4\">P4<\u002Fa>.<\u002Fspan><\u002Fdiv><\u002Fli>\n<li><div><b>Do a test order<\u002Fb><span>Seat a table, order, send, mark it ready, pay and clear. Then you're ready to open.<\u002Fspan><\u002Fdiv><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section id=\"rk-day\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 3<\u002Fp>\n<h2>Run the day<\u002Fh2>\n<p class=\"sub\">The real order of a service, and which screen you use for each moment.<\u002Fp>\n<div class=\"tbl\"><table>\n<thead><tr><th>Moment<\u002Fth><th>What you do<\u002Fth><th>Screen<\u002Fth><th>Tier<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><b>Before opening<\u002Fb><\u002Ftd><td>Turn on the main device. Check every device is connected and the light shows Synced.<\u002Ftd><td>Any<\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Guests arrive<\u002Fb><\u002Ftd><td>Tap a free table, enter the number of guests.<\u002Ftd><td><a href=\"#s-floor\">Floor<\u002Fa><\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Take the order<\u002Fb><\u002Ftd><td>Tap dishes, add notes (no piment, allergies), tap Send.<\u002Ftd><td><a href=\"#s-register\">Register<\u002Fa><\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>In the kitchen<\u002Fb><\u002Ftd><td>Orders arrive by station. Tap Mark Ready, then Served.<\u002Ftd><td><a href=\"#s-kitchen\">Kitchen<\u002Fa><\u002Ftd><td><span class=\"tier mid\">Mid<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Starters, then mains<\u002Fb><\u002Ftd><td>Send course 1 now, fire course 2 when the table is ready.<\u002Ftd><td>Register<\u002Ftd><td><span class=\"tier mid\">Mid<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>A change<\u002Fb><\u002Ftd><td>Void a sent dish with a reason; add more dishes anytime.<\u002Ftd><td>Register<\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Table moves<\u002Fb><\u002Ftd><td>Move the party, join two tables, or move a few dishes to another bill.<\u002Ftd><td>Floor · Register<\u002Ftd><td><span class=\"tier mid\">Mid<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>The bill<\u002Fb><\u002Ftd><td>Request the bill, split it, take MoMo and cash.<\u002Ftd><td>Register<\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Clear the table<\u002Fb><\u002Ftd><td>The table goes free and the kitchen screen clears it.<\u002Ftd><td>Floor<\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Self-order<\u002Fb><\u002Ftd><td>Customers order on the kiosk; pay by MoMo or at the counter.<\u002Ftd><td><a href=\"#s-kiosk\">Kiosk<\u002Fa><\u002Ftd><td><span class=\"tier full\">Full<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td><b>Closing<\u002Fb><\u002Ftd><td>Wait for Synced. Review today's voids. Close the shift.<\u002Ftd><td><a href=\"#s-setup\">Setup<\u002Fa><\u002Ftd><td><span class=\"tier lite\">Lite<\u002Fspan><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rk-screens\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 4<\u002Fp>\n<h2>Screens<\u002Fh2>\n<p class=\"sub\">The left rail switches screens: Order, Floor, Kitchen, Kiosk, Today, and Setup at the bottom. On a phone, the same screens stack into one column.<\u002Fp>\n\n<h3 id=\"s-register\">Register <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh3>\n<div class=\"shot\"><img src=\"db89053d-6456-45e0-9c9e-631ffb8023f7\" alt=\"Register screen\"><span class=\"pin\" style=\"left:12%;top:10.5%\">1<\u002Fspan><span class=\"pin\" style=\"left:30%;top:21.5%\">2<\u002Fspan><span class=\"pin\" style=\"left:20%;top:32%\">3<\u002Fspan><span class=\"pin\" style=\"left:52%;top:16.8%\">4<\u002Fspan><span class=\"pin\" style=\"left:68%;top:28%\">5<\u002Fspan><span class=\"pin\" style=\"left:15%;top:95%\">6<\u002Fspan><span class=\"pin\" style=\"left:26%;top:95%\">7<\u002Fspan><span class=\"pin\" style=\"left:91%;top:3.4%\">8<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Table<\u002Fb> — pick the table first, or start a walk-in and choose the table when you send.<\u002Fspan><\u002Fli>\n<li><span><b>Fire<\u002Fb> — sends this course to the kitchen.<\u002Fspan><\u002Fli>\n<li><span><b>The order<\u002Fb> — tap a line to change quantity, add a note or, once sent, <b>Void<\u002Fb> it with a reason.<\u002Fspan><\u002Fli>\n<li><span><b>Categories<\u002Fb> — Starters, Mains, Grills, Drinks…<\u002Fspan><\u002Fli>\n<li><span><b>Dishes<\u002Fb> — tap to add. Tags show vegetarian, spicy, allergens.<\u002Fspan><\u002Fli>\n<li><span><b>Send<\u002Fb> — sends everything not yet sent to the kitchen.<\u002Fspan><\u002Fli>\n<li><span><b>Pay<\u002Fb> — cash, MoMo, Orange Money or split.<\u002Fspan><\u002Fli>\n<li><span><b>Sync light<\u002Fb> — see <a href=\"#p3\">P3<\u002Fa>.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<div class=\"note\"><ion-icon name=\"swap-horizontal-outline\"><\u002Fion-icon><p><b>Move<\u002Fb> (in the bar above Send) moves the whole party, or only the dishes you tick — that's how you split a bill between two tables. <span class=\"tier mid\">Mid<\u002Fspan><\u002Fp><\u002Fdiv>\n\n<h3 id=\"s-floor\">Floor <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh3>\n<div class=\"shot\"><img src=\"66bdd0a7-a26b-403c-aeb8-1378bf8f9874\" alt=\"Floor screen\"><span class=\"pin\" style=\"left:19%;top:3.5%\">1<\u002Fspan><span class=\"pin\" style=\"left:36%;top:3.5%\">2<\u002Fspan><span class=\"pin\" style=\"left:76%;top:3.5%\">3<\u002Fspan><span class=\"pin\" style=\"left:20%;top:54%\">4<\u002Fspan><span class=\"pin\" style=\"left:27%;top:19%\">5<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Areas<\u002Fb> — Main Floor, Patio, Bar. Your own names from Setup.<\u002Fspan><\u002Fli>\n<li><span><b>List or map<\u002Fb> — the list is easier on a phone; the map on a tablet.<\u002Fspan><\u002Fli>\n<li><span><b>Colours<\u002Fb> — green seated, blue order in progress, amber bill asked, red needs attention, white free.<\u002Fspan><\u002Fli>\n<li><span><b>Tap a table<\u002Fb> to seat guests, open its order, request the bill, <b>Move<\u002Fb> or clear it.<\u002Fspan><\u002Fli>\n<li><span><b>Badge<\u002Fb> — dishes in the kitchen for that table.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<div class=\"note warn\"><ion-icon name=\"restaurant-outline\"><\u002Fion-icon><p><b>Clearing a table with food still cooking?<\u002Fb> Koomzo asks: keep cooking as take-away, mark it already served, or cancel it. Nothing disappears from the kitchen without a decision.<\u002Fp><\u002Fdiv>\n\n<h3 id=\"s-kitchen\">Kitchen screen <span class=\"tier mid\">Mid<\u002Fspan><\u002Fh3>\n<div class=\"shot\"><img src=\"0f86043d-89a1-4473-8c01-c708b0352eb0\" alt=\"Kitchen screen\"><span class=\"pin\" style=\"left:9%;top:10%\">1<\u002Fspan><span class=\"pin\" style=\"left:34%;top:16%\">2<\u002Fspan><span class=\"pin\" style=\"left:15%;top:23%\">3<\u002Fspan><span class=\"pin\" style=\"left:20%;top:38.5%\">4<\u002Fspan><span class=\"pin\" style=\"left:51%;top:35%\">5<\u002Fspan><span class=\"pin\" style=\"left:93%;top:10%\">6<\u002Fspan><span class=\"pin\" style=\"left:88%;top:3.5%\">7<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Lanes<\u002Fb> — To cook, Ready, Served. Oldest order first.<\u002Fspan><\u002Fli>\n<li><span><b>Timer<\u002Fb> — turns amber, then red, when an order is late.<\u002Fspan><\u002Fli>\n<li><span><b>Stations<\u002Fb> — what each station still has to make. <span class=\"tier full\">Full<\u002Fspan><\u002Fspan><\u002Fli>\n<li><span><b>Mark Ready<\u002Fb> — the server's phone is told.<\u002Fspan><\u002Fli>\n<li><span><b>Served<\u002Fb> — the runner has taken it out.<\u002Fspan><\u002Fli>\n<li><span><b>Clear all<\u002Fb> — tidy the Served lane. Paid tables clear themselves.<\u002Fspan><\u002Fli>\n<li><span><b>Area filter<\u002Fb> — one kitchen for the salle, another for the terrasse.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p class=\"sub\">A voided dish appears crossed out with <b>VOID<\u002Fb>; a changed note shows <b>CHANGED<\u002Fb>. The cook taps <b>Seen<\u002Fb> so the server knows.<\u002Fp>\n\n<h3 id=\"s-kiosk\">Kiosk <span class=\"tier full\">Full<\u002Fspan><\u002Fh3>\n<div class=\"shot\"><img src=\"00191d7c-b4b2-43f8-85b2-f33fed63339f\" alt=\"Kiosk welcome screen\"><span class=\"pin\" style=\"left:13%;top:2.8%\">1<\u002Fspan><span class=\"pin\" style=\"left:87%;top:2.8%\">2<\u002Fspan><span class=\"pin\" style=\"left:53%;top:35%\">3<\u002Fspan><span class=\"pin\" style=\"left:53%;top:62%\">4<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Staff preview<\u002Fb> — see how the kiosk looks on a desktop, tablet or phone.<\u002Fspan><\u002Fli>\n<li><span><b>Start kiosk mode<\u002Fb> — locks the device: staff screens disappear.<\u002Fspan><\u002Fli>\n<li><span><b>To leave<\u002Fb>, press and hold the logo, then enter the manager PIN.<\u002Fspan><\u002Fli>\n<li><span><b>Eat in or Takeaway<\u002Fb> — the customer browses, orders and pays by MoMo, or pays at the counter.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p class=\"sub\">After 90 seconds without a touch, the kiosk empties the basket and returns to the welcome screen.<\u002Fp>\n\n<h3 id=\"s-setup\">Setup <span class=\"tier lite\">Lite<\u002Fspan><\u002Fh3>\n<div class=\"shot\"><img src=\"243eff6f-d780-4d48-b5c5-e03a605341bc\" alt=\"Floor plan editor\"><span class=\"pin\" style=\"left:13%;top:10.5%\">1<\u002Fspan><span class=\"pin\" style=\"left:92%;top:10.5%\">2<\u002Fspan><span class=\"pin\" style=\"left:40%;top:50%\">3<\u002Fspan><span class=\"pin\" style=\"left:89%;top:47%\">4<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Areas<\u002Fb> — add, rename, reorder. <span class=\"tier mid\">Mid<\u002Fspan><\u002Fspan><\u002Fli>\n<li><span><b>Start from a layout<\u002Fb> — the presets from Part 1, with the number of tables.<\u002Fspan><\u002Fli>\n<li><span><b>Drag tables<\u002Fb> into place on a tablet. On a phone, edit them as a list.<\u002Fspan><\u002Fli>\n<li><span><b>Add a table<\u002Fb> — square, round, long or a bar stool. Set its label and seats.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<div class=\"shot\"><img src=\"b835e113-3827-4e4d-9188-b7283bb43429\" alt=\"Service rules\"><span class=\"pin\" style=\"left:42%;top:16.6%\">1<\u002Fspan><span class=\"pin\" style=\"left:42%;top:31.7%\">2<\u002Fspan><span class=\"pin\" style=\"left:44%;top:62%\">3<\u002Fspan><span class=\"pin\" style=\"left:42%;top:77%\">4<\u002Fspan><span class=\"pin\" style=\"left:42%;top:86.5%\">5<\u002Fspan><\u002Fdiv>\n<ol class=\"callouts\">\n<li><span><b>Void approval<\u002Fb> — after cooking starts, always, or never. <span class=\"tier full\">Full<\u002Fspan><\u002Fspan><\u002Fli>\n<li><span><b>Owner approves from his phone<\u002Fb> when no manager is on site. <span class=\"soon\"><ion-icon name=\"time-outline\"><\u002Fion-icon>Soon<\u002Fspan><\u002Fspan><\u002Fli>\n<li><span><b>Served tickets<\u002Fb> leave the kitchen after 10 minutes.<\u002Fspan><\u002Fli>\n<li><span><b>Kiosk mode<\u002Fb> can also be started here.<\u002Fspan><\u002Fli>\n<li><span><b>Today's voids<\u002Fb> — by reason and by server.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section id=\"rk-help\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 5<\u002Fp>\n<h2>When something goes wrong<\u002Fh2>\n<div class=\"qa\">\n<div class=\"card\"><h4><ion-icon name=\"flash-off-outline\"><\u002Fion-icon>The power went off in the middle of service.<\u002Fh4><p>Keep working on battery. Every order is already saved. When power returns, open the app — open tables come back as they were.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"cloud-offline-outline\"><\u002Fion-icon>No internet, and a guest wants to pay by MoMo.<\u002Fh4><p>Take cash, or keep the bill open and confirm the MoMo when the internet returns. Everything else carries on.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"battery-dead-outline\"><\u002Fion-icon>The main device died.<\u002Fh4><p>Phones keep taking orders and hold them. Charge it and turn it on — or a manager makes another device the main one. <span class=\"soon\">Soon<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"walk-outline\"><\u002Fion-icon>A guest left before the food came out.<\u002Fh4><p>Clear the table and choose <i>Cancel<\u002Fi>. It's logged as a void and shown to the kitchen.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"hand-left-outline\"><\u002Fion-icon>The cook forgot to tap Served.<\u002Fh4><p>When you clear the table, choose <i>Already served<\u002Fi>. Served tickets also leave the screen by themselves after 10 minutes.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"swap-horizontal-outline\"><\u002Fion-icon>We put the order on the wrong table.<\u002Fh4><p>Open the order → Move → pick the right table. The kitchen ticket is relabelled.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"alert-circle-outline\"><\u002Fion-icon>A server says they didn't void that dish.<\u002Fh4><p>Setup → Service rules → Today's voids shows who voided what, when, why, and who approved.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h4><ion-icon name=\"warning-outline\"><\u002Fion-icon>The sync light shows \"needs attention\".<\u002Fh4><p>A change couldn't be accepted by the cloud. The manager opens it and chooses what to keep. Nothing is lost.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rk-more\" class=\"part\">\n<p class=\"eb\">Restaurant &amp; Bar · Part 6<\u002Fp>\n<h2>Go further<\u002Fh2>\n<p class=\"sub\">Switch these on in Setup → Modules when you're ready.<\u002Fp>\n<div class=\"grid3\">\n<div class=\"card ic-card\"><ion-icon name=\"layers-outline\"><\u002Fion-icon><h4>Courses <span class=\"tier mid\">Mid<\u002Fspan><\u002Fh4><p>Hold mains until starters are cleared, then fire them.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"git-branch-outline\"><\u002Fion-icon><h4>Kitchen stations <span class=\"tier full\">Full<\u002Fspan><\u002Fh4><p>Grill, sauce pot, fryer, bar — each sees only its dishes.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"albums-outline\"><\u002Fion-icon><h4>All-day counts <span class=\"tier full\">Full<\u002Fspan><\u002Fh4><p>\"12 Ndolé to make\" across every open order.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"wine-outline\"><\u002Fion-icon><h4>Bar tabs <span class=\"tier full\">Full<\u002Fspan><\u002Fh4><p>Open a named tab at the bar and settle at the end.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"bed-outline\"><\u002Fion-icon><h4>Charge to room <span class=\"tier mid\">Mid<\u002Fspan><\u002Fh4><p>Hotel restaurants post the bill to the guest's room.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"shield-checkmark-outline\"><\u002Fion-icon><h4>Void rules <span class=\"tier full\">Full<\u002Fspan><\u002Fh4><p>Manager PIN for voids; owner approval by phone. <span class=\"soon\">Soon<\u002Fspan><\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"print-outline\"><\u002Fion-icon><h4>Print to kitchen <span class=\"soon\">Soon<\u002Fspan><\u002Fh4><p>No kitchen screen? A Bluetooth printer per station prints each order and each void.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"beer-outline\"><\u002Fion-icon><h4>Drinks stock <span class=\"soon\">Soon<\u002Fspan><\u002Fh4><p>Each beer sold leaves stock. Count weekly and see what's missing.<\u002Fp><\u002Fdiv>\n<div class=\"card ic-card\"><ion-icon name=\"business-outline\"><\u002Fion-icon><h4>Several locations <span class=\"tier full\">Full<\u002Fspan><\u002Fh4><p>Two maquis, one owner, one set of figures.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rk-cards\" class=\"part\">\n<p class=\"eb\">Print and pin up<\u002Fp>\n<h2>Staff task cards<\u002Fh2>\n<div class=\"tasks\">\n<div class=\"task\"><b><ion-icon name=\"walk-outline\"><\u002Fion-icon> Server<\u002Fb><span>1. Floor → tap table → guests.<br>2. Order → dishes → Send.<br>3. Change? Tap the dish → Void + reason.<br>4. Phone says Ready → serve.<br>5. Floor → Bill.<\u002Fspan><\u002Fdiv>\n<div class=\"task\"><b><ion-icon name=\"cash-outline\"><\u002Fion-icon> Cashier<\u002Fb><span>1. Open the shift with the float.<br>2. Open the table → Pay.<br>3. MoMo: number → wait for confirm.<br>4. Clear the table.<br>5. Closing: wait for Synced → close shift.<\u002Fspan><\u002Fdiv>\n<div class=\"task\"><b><ion-icon name=\"restaurant-outline\"><\u002Fion-icon> Cook<\u002Fb><span>1. New order appears in To cook.<br>2. Done → Mark Ready.<br>3. VOID or CHANGED? Read → Seen.<br>4. Runner takes it → Served.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<p class=\"foot\">Koomzo User Guide · Restaurant &amp; Bar · Version 1 · Screens shown are from the current Koomzo prototype. Names, dishes and prices are examples.<\u002Fp>\n<\u002Fmain>\n<\u002Fdiv>\n<script src=\"38ec36bf-fc9e-46d3-a52c-89d07df03017\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
